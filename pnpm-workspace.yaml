catalogMode: strict

# The same entries pnpmfile.mjs ships to consumers (tests/pnpmfile.test.ts keeps them equal), plus
# what only this repo needs. This repo cannot read its own config dependency, so it lists them here.
catalog:
  "@cloudflare/workers-types": ^5.20261004.1
  "@cucumber/cucumber": ^12.0.0
  "@rafters/release": ^0.1.2
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  wrangler: ^4.147.0
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@rafters/release@0.1.1"
  - "@rafters/release@0.1.2"
